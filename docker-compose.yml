# Start everything:  docker compose up --build
# API docs:          http://localhost:8000/docs
# MLflow UI:         http://localhost:5000
# Prometheus:        http://localhost:9090
# Grafana:           http://localhost:3000  (admin / admin)

services:

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:         postgresql+psycopg2://finguard:finguard@postgres:5432/finguard
      REDIS_URL:            redis://redis:6379/0
      MLFLOW_TRACKING_URI:  http://mlflow:5000
      MODEL_DIR:            /models/model
      FEATURE_FILE:         /data/ieee_ready.npz
      GROQ_API_KEY:         ${GROQ_API_KEY:-}   # optional — template used when empty
    volumes:
      - ./artifacts/model:/models/model:ro       # production model (05_train_final.py)
      - ./data:/data:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 2g    # torch cpu + xgboost need a bit more than 1 GB

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     finguard
      POSTGRES_PASSWORD: finguard
      POSTGRES_DB:       finguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U finguard"]
      interval: 5s
      retries:  10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries:  10

  # ── MLflow ────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_server:/mlflow
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - api

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana_data:
